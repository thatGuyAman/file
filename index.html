<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD & CN PDF Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .pdf-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pdf-header {
      background: #2c3e50;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      background: #3498db;
      padding: 6px 12px;
      border-radius: 4px;
    }

    .pdf-header a:hover {
      background: #2980b9;
    }

    iframe {
      width: 100%;
      height: 75vh;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Course Documents</h1>

  <div class="container">
    <!-- CD PDF -->
    <div class="pdf-card">
      <div class="pdf-header">
        <h2>CD</h2>
        <a href="CD.pdf" target="_blank">Open in New Tab</a>
      </div>
      <iframe src="CD.pdf" title="CD PDF">
        Your browser does not support embedded PDFs. 
        <a href="CD.pdf">Download CD.pdf</a>.
      </iframe>
    </div>

    <!-- CN PDF -->
    <div class="pdf-card">
      <div class="pdf-header">
        <h2>CN</h2>
        <a href="CN.pdf" target="_blank">Open in New Tab</a>
      </div>
      <iframe src="CN.pdf" title="CN PDF">
        Your browser does not support embedded PDFs. 
        <a href="CN.pdf">Download CN.pdf</a>.
      </iframe>
    </div>
  </div>

</body>
</html>

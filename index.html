<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD & CN PDF Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    .pdf-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2c3e50;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      padding: 20px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s, transform 0.1s;
    }

    .pdf-bar:hover {
      background-color: #3498db;
      transform: translateY(-2px);
    }

    .pdf-bar span {
      font-size: 14px;
      font-weight: normal;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h1>Course Documents</h1>

  <div class="container">
    <a href="CD.pdf" target="_blank" class="pdf-bar">
      CD
      <span>Open PDF →</span>
    </a>

    <a href="CN.pdf" target="_blank" class="pdf-bar">
      CN
      <span>Open PDF →</span>
    </a>
  </div>

</body>
</html>
